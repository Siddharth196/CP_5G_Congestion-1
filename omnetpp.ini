# Run from a shell via the `run` script (it sets the NED path), e.g.:
#     sh run -c Tiny
[General]
network = UrbanCongestionCluster
sim-time-limit = 120s
seed-set = ${repetition}
**.routingRecorder.enabled = false
allow-object-stealing-on-deletion = true
repeat = 1
# ---------------------------------------------------------------
# Output files
# ---------------------------------------------------------------
output-scalar-file = ${resultdir}/${configname}-${repetition}.sca
output-vector-file = ${resultdir}/${configname}-${repetition}.vec
**.scalar-recording = true


cmdenv-express-mode = true
**.cmdenv-log-level = WARN

**.downlinkInterference = true
**.uplinkInterference = true
# ---------------------------------------------------------------
# Carrier / PHY config
# ---------------------------------------------------------------
# OMNeT++ uses the FIRST matching line (active config, then its parents,
# then [General]). Node-specific values must therefore come BEFORE the `**`
# defaults. They used to come after them, so the `**` lines won: every gNB
# ran at 40dBm and every UE at 26dBm regardless of the per-node lines.

# gNB transmit power (moved here from "Base station placement")
*.macroGnb.cellularNic.phy.eNodeBTxPower = 46dBm
*.microGnb*.cellularNic.phy.eNodeBTxPower = 30dBm

# UE heterogeneity (moved here from below). In standalone mode the live UE
# PHY is nrPhy; the LTE-side `phy` is idle, so the old lines targeting
# cellularNic.phy would have changed nothing even in the right order.
# High-end phones (UE 0-24)
*.ue[0..24].cellularNic.nrPhy.ueTxPower = 26dBm
# Low-end IoT devices (UE 25-49)
*.ue[25..49].cellularNic.nrPhy.ueTxPower = 20dBm

**.numBands = 50
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm   # fallback only: every gNB is set explicitly above
**.targetBler = 0.01
**.blerShift = 5

# Per-UE buffer limit — causes real packet drops under congestion.
# The backlog lives in the RLC UM transmit buffer (LteRlcUm.queueSize, one
# per bearer), NOT in the MAC: the MAC only holds the SDUs it pulls from RLC
# to fill the current grant, so the old `mac.queueSize = 128KiB` line never
# dropped anything. gNB `rlc` = downlink, UE `nrRlc` = uplink.
**.cellularNic.rlc.um.queueSize = 128KiB
**.cellularNic.nrRlc.um.queueSize = 128KiB

# Scheduler — Proportional Fair gives realistic resource allocation.
# Other values: DRR, MAXCI (the Simu5G default), MAXCI_MB, MAXCI_OPT_MB,
# MAXCI_COMP, ALLOCATOR_BESTFIT.
*.macroGnb.cellularNic.mac.schedulingDisciplineDl = "PF"
*.macroGnb.cellularNic.mac.schedulingDisciplineUl = "PF"
*.microGnb1.cellularNic.mac.schedulingDisciplineDl = "PF"
*.microGnb1.cellularNic.mac.schedulingDisciplineUl = "PF"
*.microGnb2.cellularNic.mac.schedulingDisciplineDl = "PF"
*.microGnb2.cellularNic.mac.schedulingDisciplineUl = "PF"
*.microGnb3.cellularNic.mac.schedulingDisciplineDl = "PF"
*.microGnb3.cellularNic.mac.schedulingDisciplineUl = "PF"

# REMOVED: **.cellularNic.mac.harqProcesses = 4
# Simu5G 1.4.3 reads this parameter but sizes the gNB's HARQ buffers from the
# compile-time constants ENB_TX_HARQ_PROCESSES / ENB_RX_HARQ_PROCESSES, and
# `mac` on a UE is the idle LTE MAC, so the line had no effect anywhere.

*.carrierAggregation.componentCarrier[0].numerologyIndex = 0
*.carrierAggregation.componentCarrier[0].carrierFrequency = 2GHz
*.carrierAggregation.componentCarrier[0].numBands = 50

*.macroGnb.cellularNic.numCarriers = 1
*.microGnb1.cellularNic.numCarriers = 1
*.microGnb2.cellularNic.numCarriers = 1
*.microGnb3.cellularNic.numCarriers = 1
*.ue[*].cellularNic.numCarriers = 1

*.macroGnb.cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.microGnb1.cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.microGnb2.cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.microGnb3.cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.ue[*].cellularNic.nrChannelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"

# ---------------------------------------------------------------
# IP Configurator
# ---------------------------------------------------------------
*.configurator.config = xmldoc("demo.xml")

# ---------------------------------------------------------------
# Base station placement (transmit power is set in the PHY block above)
# ---------------------------------------------------------------
*.macroGnb.mobility.initialX = 500m
*.macroGnb.mobility.initialY = 500m

*.microGnb1.mobility.initialX = 500m
*.microGnb1.mobility.initialY = 100m

*.microGnb2.mobility.initialX = 850m
*.microGnb2.mobility.initialY = 700m

*.microGnb3.mobility.initialX = 150m
*.microGnb3.mobility.initialY = 700m

# ---------------------------------------------------------------
# Background interference cells — simulate neighbouring network
# ---------------------------------------------------------------
# A Simu5G BackgroundCell has NO cellularNic: power, carrier, bands and
# numerology belong to its bgScheduler, and it only occupies resources (and
# so only interferes) if it has background UEs generating traffic. The old
# `bgCell[*].cellularNic.*` lines matched nothing and the defaults are
# numBgUes = 0, so these four cells produced no interference at all — one
# reason CQI sat at 14-15. Upstream reference: simulations/nr/bgTraffic.
# Load per cell below is a tunable knob, not a calibrated value.
**.bgCellInterference = true

*.bgCell[0].mobility.initialX = 0m
*.bgCell[0].mobility.initialY = 0m
*.bgCell[1].mobility.initialX = 1000m
*.bgCell[1].mobility.initialY = 0m
*.bgCell[2].mobility.initialX = 0m
*.bgCell[2].mobility.initialY = 1000m
*.bgCell[3].mobility.initialX = 1000m
*.bgCell[3].mobility.initialY = 1000m

# Same carrier as the real cells (2GHz, 50 RBs, numerology 0)
*.bgCell[*].bgScheduler.isNr = true
*.bgCell[*].bgScheduler.carrierFrequency = 2GHz
*.bgCell[*].bgScheduler.numBands = 50
*.bgCell[*].bgScheduler.numerologyIndex = 0
*.bgCell[*].bgScheduler.txPower = 30dBm

# Background UEs: 10 per cell, CBR in both directions, placed in the corner
# quadrant each cell sits in.
*.bgCell[*].bgTrafficGenerator.numBgUes = 10
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.typename = "TrafficGeneratorCbr"
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.startTimeDl = uniform(0s, 0.05s)
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.startTimeUl = uniform(0s, 0.05s)
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.packetSizeDl = 1000B
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.periodDl = 10ms
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.packetSizeUl = 500B
*.bgCell[*].bgTrafficGenerator.bgUE[*].generator.periodUl = 20ms

*.bgCell[0].bgTrafficGenerator.bgUE[*].mobility.initialX = uniform(0m, 300m)
*.bgCell[0].bgTrafficGenerator.bgUE[*].mobility.initialY = uniform(0m, 300m)
*.bgCell[1].bgTrafficGenerator.bgUE[*].mobility.initialX = uniform(700m, 1000m)
*.bgCell[1].bgTrafficGenerator.bgUE[*].mobility.initialY = uniform(0m, 300m)
*.bgCell[2].bgTrafficGenerator.bgUE[*].mobility.initialX = uniform(0m, 300m)
*.bgCell[2].bgTrafficGenerator.bgUE[*].mobility.initialY = uniform(700m, 1000m)
*.bgCell[3].bgTrafficGenerator.bgUE[*].mobility.initialX = uniform(700m, 1000m)
*.bgCell[3].bgTrafficGenerator.bgUE[*].mobility.initialY = uniform(700m, 1000m)

# ---------------------------------------------------------------
# UE mobility
# ---------------------------------------------------------------
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

*.ue[*].mobility.typename = "RandomWaypointMobility"
*.ue[*].mobility.speed = uniform(1mps, 5mps)
*.ue[*].mobility.waitTime = uniform(0s, 5s)
*.ue[*].mobility.initialX = uniform(0m, 1000m)
*.ue[*].mobility.initialY = uniform(0m, 1000m)

# ---------------------------------------------------------------
# Cell association
# ---------------------------------------------------------------
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1
**.dynamicCellAssociation = true
**.enableHandover = true

# X2 app configuration — one app per peer for each gNB
*.macroGnb.numX2Apps = 3
*.microGnb1.numX2Apps = 3
*.microGnb2.numX2Apps = 3
*.microGnb3.numX2Apps = 3

# X2 server ports
*.macroGnb.x2App[*].server.localPort = 5000 + ancestorIndex(1)
*.microGnb1.x2App[*].server.localPort = 5000 + ancestorIndex(1)
*.microGnb2.x2App[*].server.localPort = 5000 + ancestorIndex(1)
*.microGnb3.x2App[*].server.localPort = 5000 + ancestorIndex(1)

# X2 client connections — each gNB connects to its 3 peers
*.macroGnb.x2App[0].client.connectAddress = "microGnb1%x2ppp0"
*.macroGnb.x2App[1].client.connectAddress = "microGnb2%x2ppp0"
*.macroGnb.x2App[2].client.connectAddress = "microGnb3%x2ppp0"

*.microGnb1.x2App[0].client.connectAddress = "macroGnb%x2ppp0"
*.microGnb1.x2App[1].client.connectAddress = "microGnb2%x2ppp1"
*.microGnb1.x2App[2].client.connectAddress = "microGnb3%x2ppp1"

*.microGnb2.x2App[0].client.connectAddress = "macroGnb%x2ppp1"
*.microGnb2.x2App[1].client.connectAddress = "microGnb1%x2ppp1"
*.microGnb2.x2App[2].client.connectAddress = "microGnb3%x2ppp2"

*.microGnb3.x2App[0].client.connectAddress = "macroGnb%x2ppp2"
*.microGnb3.x2App[1].client.connectAddress = "microGnb1%x2ppp2"
*.microGnb3.x2App[2].client.connectAddress = "microGnb2%x2ppp2"

# (UE heterogeneity / TX power moved to the PHY block at the top.)

# ---------------------------------------------------------------
# Traffic: CBR downlink from server to all UEs
# ---------------------------------------------------------------
*.ue[*].numApps = 3
*.ue[*].app[0].typename = "CbrReceiver"
*.ue[*].app[0].localPort = 3000
*.ue[*].app[1].typename = "CbrSender"
*.ue[*].app[1].packetSize = 100B
*.ue[*].app[1].samplingTime = 0.02s
*.ue[*].app[1].destAddress = "server"
*.ue[*].app[1].destPort = 5000
*.ue[*].app[1].localPort = 4000 + ancestorIndex(1)
*.ue[*].app[1].startTime = uniform(0s, 0.02s)

*.ue[0..29].app[2].typename = "UdpBasicApp"
*.ue[0..29].app[2].destAddresses = "server"
*.ue[0..29].app[2].destPort = 6000
*.ue[0..29].app[2].messageLength = 500B
*.ue[0..29].app[2].sendInterval = 5ms
*.ue[0..29].app[2].startTime = 50s
*.ue[0..29].app[2].stopTime = 65s
*.ue[30..49].app[2].typename = "UdpBasicApp"
*.ue[30..49].app[2].destAddresses = "server"
*.ue[30..49].app[2].destPort = 6000
*.ue[30..49].app[2].messageLength = 100B
*.ue[30..49].app[2].sendInterval = 100ms
*.ue[30..49].app[2].startTime = 50s
*.ue[30..49].app[2].stopTime = 70s

*.server.numApps = 52
# Group 1 (UE 0-19): Video streaming — large packets, higher rate
*.server.app[0..19].typename = "CbrSender"
*.server.app[0..19].packetSize = 1400B
*.server.app[0..19].samplingTime = 0.004s
*.server.app[0..19].destAddress = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[0..19].destPort = 3000
*.server.app[0..19].localPort = 3088 + ancestorIndex(0)
*.server.app[0..19].startTime = uniform(0s, 0.02s)

# Group 2 (UE 20-34): Web browsing — medium packets
*.server.app[20..34].typename = "CbrSender"
*.server.app[20..34].packetSize = 500B
*.server.app[20..34].samplingTime = 0.02s
*.server.app[20..34].destAddress = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[20..34].destPort = 3000
*.server.app[20..34].localPort = 3088 + ancestorIndex(0)
*.server.app[20..34].startTime = uniform(0s, 0.02s)

# Group 3 (UE 35-49): IoT — tiny frequent packets
*.server.app[35..49].typename = "CbrSender"
*.server.app[35..49].packetSize = 40B
*.server.app[35..49].samplingTime = 0.01s
*.server.app[35..49].destAddress = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[35..49].destPort = 3000
*.server.app[35..49].localPort = 3088 + ancestorIndex(0)
*.server.app[35..49].startTime = uniform(0s, 0.02s)

*.server.app[50].typename = "CbrReceiver"
*.server.app[50].localPort = 5000
*.server.app[51].typename = "UdpSink"
*.server.app[51].localPort = 6000
# ---------------------------------------------------------------
# VECTOR RECORDING
# ---------------------------------------------------------------
# Only the vectors switched on below are written. Every INET/Simu5G module
# records vectors by default (per-packet byte counts on every layer of every
# node), and `**.vector-recording = true` used to keep ALL of them — the
# result-recording-modes lines only narrowed the chosen statistics, they did
# not turn anything else off. The catch-all `**.vector-recording = false` at
# the END of this block now does that. It must stay last: first match wins.
#
# The key is matched against "<module path>.<vector name>", and a
# statistic's vector name is "<statistic>:<mode>", e.g. avgServedBlocksDl:vector
# or, for signals that carry packets, sentPacketToUpperLayer:vector(packetBytes).
# Those are the statistics' DEFAULT recording modes, so no
# result-recording-modes override is needed (which also rules out the
# 'Cannot convert cObject * to double' crash from plain `vector` on packets).
#
# Module paths, statistic names and emitting modules were checked against
# the Simu5G 1.4.3 sources and the .vci index from an earlier run.

# --- gNB MAC: scheduler resource allocation. This is the congestion signal. --
# avgServedBlocksDl exists ONLY on <gnb>.cellularNic.mac (the old `mac.**.`
# pattern required an extra path element and never matched).
# It is the CELL total of RBs allocated in one scheduling round (one TTI);
# Simu5G has no per-UE served-RB statistic. Summed over a 250 ms bin it is
# capped at 250 x 50 = 12,500 — the same ceiling as TRACTOR's per-UE
# sum_granted_prbs, but the quantity is per cell, not per UE.
# DL emits an explicit 0 while the scheduler sleeps; UL emits only when it
# schedules, so treat a missing UL sample in a bin as 0, not as NaN.
*.macroGnb.cellularNic.mac.avgServedBlocksDl:vector.vector-recording = true
*.macroGnb.cellularNic.mac.avgServedBlocksUl:vector.vector-recording = true
*.microGnb*.cellularNic.mac.avgServedBlocksDl:vector.vector-recording = true
*.microGnb*.cellularNic.mac.avgServedBlocksUl:vector.vector-recording = true

# --- MAC: queueing delay and HARQ --------------------------------------------
# `mac` = the gNB MAC (and each UE's idle LTE MAC); `nrMac` = the UE's live MAC.
*.macroGnb.cellularNic.mac.macDelayDl:vector.vector-recording = true
*.microGnb*.cellularNic.mac.macDelayDl:vector.vector-recording = true
**.cellularNic.mac.harqErrorRateDl:vector.vector-recording = true
**.cellularNic.mac.harqErrorRateUl:vector.vector-recording = true
**.cellularNic.mac.harqTxAttemptsDl:vector.vector-recording = true
**.cellularNic.nrMac.harqErrorRateDl:vector.vector-recording = true
**.cellularNic.nrMac.harqErrorRateUl:vector.vector-recording = true
**.cellularNic.nrMac.harqTxAttemptsDl:vector.vector-recording = true

# --- Channel quality --------------------------------------------------------
# In standalone mode (servingNodeId = 0) the UE's NR stack — nrPhy, nrMac,
# nrRlc, nrChannelModel — carries all traffic. The LTE-side phy /
# channelModel lines are kept only as a sanity check and should come back
# empty or constant. servingCell is emitted only at attach and at handover,
# so forward-fill it; if an older parser read it from `phy` instead of
# `nrPhy`, that alone would produce the "zero handovers" finding.
*.ue[*].cellularNic.phy.averageCqiDl:vector.vector-recording = true
*.ue[*].cellularNic.phy.averageCqiUl:vector.vector-recording = true
*.ue[*].cellularNic.phy.servingCell:vector.vector-recording = true
*.ue[*].cellularNic.nrPhy.averageCqiDl:vector.vector-recording = true
*.ue[*].cellularNic.nrPhy.averageCqiUl:vector.vector-recording = true
*.ue[*].cellularNic.nrPhy.servingCell:vector.vector-recording = true

# SINR lives on channelModel / nrChannelModel, NOT on phy.
*.ue[*].cellularNic.channelModel[*].rcvdSinrDl:vector.vector-recording = true
*.ue[*].cellularNic.nrChannelModel[*].rcvdSinrDl:vector.vector-recording = true
# Uplink SINR is computed at the gNB but EMITTED ON THE UE's channel model
# (LteRealisticChannelModel::getSINR calls ueChannelModel->emit), so it is
# per-UE and lives here. The old gNB-side measuredSinrUl lines would always
# have come back empty.
*.ue[*].cellularNic.nrChannelModel[*].measuredSinrUl:vector.vector-recording = true
*.ue[*].cellularNic.nrChannelModel[*].measuredSinrDl:vector.vector-recording = true

# --- RLC ---------------------------------------------------------------------
# rlcThroughputDl is a RUNNING AVERAGE (total bytes / elapsed time), not an
# instantaneous rate. Kept for diagnosis only. Do NOT use it as a throughput
# feature; use the PDCP/RLC byte counters below instead.
**.cellularNic.rlc.um.rlcThroughputDl:vector.vector-recording = true
**.cellularNic.rlc.um.rlcThroughputUl:vector.vector-recording = true
**.cellularNic.rlc.um.rlcDelayDl:vector.vector-recording = true
**.cellularNic.nrRlc.um.rlcThroughputDl:vector.vector-recording = true
**.cellularNic.nrRlc.um.rlcThroughputUl:vector.vector-recording = true
**.cellularNic.nrRlc.um.rlcDelayDl:vector.vector-recording = true

# --- Byte counters: the correct throughput source ---------------------------
# Each emission carries one packet's size, so summing within a bin gives
# bytes-in-bin. Do NOT difference them: they are not cumulative counters.
# DL served, per UE: bytes PDCP delivers up to the UE's IP layer.
*.ue[*].cellularNic.pdcp.sentPacketToUpperLayer:vector(packetBytes).vector-recording = true
# UL OFFERED, per UE: bytes the UE's IP layer hands to PDCP. This does not
# drop when the UE is starved, so on its own it is NOT a throughput feature.
*.ue[*].cellularNic.pdcp.receivedPacketFromUpperLayer:vector(packetBytes).vector-recording = true
# UL SERVED, per UE: RLC PDUs the UE actually sends into its UL grants.
# served / offered per bin is a candidate per-UE stand-in for
# granted / requested, which Simu5G does not emit.
*.ue[*].cellularNic.nrRlc.um.sentPacketToLowerLayer:vector(packetBytes).vector-recording = true
# UL delivered, per cell.
*.macroGnb.cellularNic.pdcp.sentPacketToUpperLayer:vector(packetBytes).vector-recording = true
*.microGnb*.cellularNic.pdcp.sentPacketToUpperLayer:vector(packetBytes).vector-recording = true

# --- Application layer -------------------------------------------------------
# app[0] is Simu5G's CbrReceiver, whose statistics are cbrFrameDelay and
# cbrReceivedBytes. It has NO endToEndDelay or packetReceived — those belong
# to INET apps (UdpSink, UdpBasicApp), which is what the earlier run that
# suggested them had as app[0]. The previous two lines here matched nothing.
*.ue[*].app[0].cbrFrameDelay:vector.vector-recording = true
*.ue[*].app[0].cbrReceivedBytes:vector.vector-recording = true

# --- Backhaul queues (wired side, not the MAC buffer) ------------------------
**.pppIf.queue.queueLength:vector.vector-recording = true

# REMOVED:
#   **.cellularNic.mac.**.macBufferSize      (no MAC buffer statistic at all)
#   **.cellularNic.mac.**.droppedPkts        (no such statistic)
#   *.ue[*].app[0].endToEndDelay / packetReceived    (not on CbrReceiver)
#   <gnb>.cellularNic.channelModel[*].measuredSinrUl (emitted on the UE)

# Everything not enabled above. Keep this line LAST in the block.
**.vector-recording = false

# ---------------------------------------------------------------
# Configs
# ---------------------------------------------------------------
[Config UrbanCongestion]
description = "Urban congestion cluster - macro + 3 micro gNBs, 50 UEs"



[Config Medium]
extends = UrbanCongestion
sim-time-limit = 30s
*.numUEs = 10
# Receivers must sit ABOVE the sender indices, else the CbrReceiver and
# UdpSink vanish and all uplink traffic is sent to closed ports.
*.server.numApps = 12
*.server.app[10].typename = "CbrReceiver"
*.server.app[10].localPort = 5000
*.server.app[11].typename = "UdpSink"
*.server.app[11].localPort = 6000


[Config Tiny]
extends = UrbanCongestion
sim-time-limit = 5s
*.numUEs = 2
*.server.numApps = 4
*.server.app[2].typename = "CbrReceiver"
*.server.app[2].localPort = 5000
*.server.app[3].typename = "UdpSink"
*.server.app[3].localPort = 6000

[Config GradualCongestion]
extends = UrbanCongestion
*.ue[0..9].app[2].startTime = 30s
*.ue[0..19].app[2].startTime = 50s
*.ue[0..29].app[2].startTime = 70s
*.ue[0..29].app[2].sendInterval = 10ms
*.ue[0..29].app[2].stopTime = 110s

[Config LightLoad]
extends = UrbanCongestion
description = "20 UEs, light CBR traffic — baseline low-load scenario"
*.numUEs = 20
*.server.numApps = 22
*.server.app[0..19].packetSize = 100B
*.server.app[0..19].samplingTime = 0.02s
*.server.app[20].typename = "CbrReceiver"
*.server.app[20].localPort = 5000
*.server.app[21].typename = "UdpSink"
*.server.app[21].localPort = 6000

[Config HeavyLoad]
extends = UrbanCongestion
description = "50 UEs, heavy DL traffic — saturates scheduler"
# Raise web (UE 20-34) and IoT (UE 35-49) to 800B/10ms = 640 kbit/s each.
# This used to cover app[0..49], which also CUT the video UEs (0-19) from
# 1400B/4ms = 2.8 Mbit/s to 640 kbit/s: total offered DL fell from ~59.5 to
# 32 Mbit/s, so "HeavyLoad" was lighter than the baseline. Now ~75 Mbit/s.
*.server.app[20..49].packetSize = 800B
*.server.app[20..49].samplingTime = 0.01s

[Config HighMobility]
extends = UrbanCongestion
description = "50 UEs moving at vehicular speed — frequent CQI drops"
*.ue[*].mobility.speed = uniform(10mps, 30mps)
*.ue[*].mobility.waitTime = uniform(0s, 1s)

[Config LowMobility]
extends = UrbanCongestion
description = "50 UEs moving at pedestrian speed — stable connections"
*.ue[*].mobility.speed = uniform(0.5mps, 1.5mps)
*.ue[*].mobility.waitTime = uniform(5s, 15s)