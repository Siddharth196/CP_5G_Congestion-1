[General]
network = UrbanCongestionCluster
sim-time-limit = 120s
seed-set = ${repetition}
**.routingRecorder.enabled = false
allow-object-stealing-on-deletion = true
repeat = 1
# ---------------------------------------------------------------
# Output files
# ---------------------------------------------------------------
output-scalar-file = ${resultdir}/${configname}-${repetition}.sca
output-vector-file = ${resultdir}/${configname}-${repetition}.vec
**.scalar-recording = true


cmdenv-express-mode = true
**.cmdenv-log-level = WARN

**.downlinkInterference = true
**.uplinkInterference = true
# ---------------------------------------------------------------
# Carrier / PHY config
# ---------------------------------------------------------------
**.numBands = 50
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.targetBler = 0.01
**.blerShift = 5

# MAC layer configuration
# Explicit buffer size limit — causes real packet drops under congestion
**.cellularNic.mac.queueSize = 128KiB

# Scheduler — Proportional Fair gives realistic resource allocation
# Uncomment alternatives to test different scheduling policies:
*.macroGnb.cellularNic.mac.schedulingDisciplineDl = "PF"
*.macroGnb.cellularNic.mac.schedulingDisciplineUl = "PF"
*.microGnb1.cellularNic.mac.schedulingDisciplineDl = "PF"
*.microGnb1.cellularNic.mac.schedulingDisciplineUl = "PF"
*.microGnb2.cellularNic.mac.schedulingDisciplineDl = "PF"
*.microGnb2.cellularNic.mac.schedulingDisciplineUl = "PF"
*.microGnb3.cellularNic.mac.schedulingDisciplineDl = "PF"
*.microGnb3.cellularNic.mac.schedulingDisciplineUl = "PF"

# HARQ processes — reduce to 4 to make retransmissions more visible
**.cellularNic.mac.harqProcesses = 4

*.carrierAggregation.componentCarrier[0].numerologyIndex = 0
*.carrierAggregation.componentCarrier[0].carrierFrequency = 2GHz
*.carrierAggregation.componentCarrier[0].numBands = 50

*.macroGnb.cellularNic.numCarriers = 1
*.microGnb1.cellularNic.numCarriers = 1
*.microGnb2.cellularNic.numCarriers = 1
*.microGnb3.cellularNic.numCarriers = 1
*.ue[*].cellularNic.numCarriers = 1

*.macroGnb.cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.microGnb1.cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.microGnb2.cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.microGnb3.cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.ue[*].cellularNic.nrChannelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"

# ---------------------------------------------------------------
# IP Configurator
# ---------------------------------------------------------------
*.configurator.config = xmldoc("demo.xml")

# ---------------------------------------------------------------
# Base station placement & power
# ---------------------------------------------------------------
*.macroGnb.mobility.initialX = 500m
*.macroGnb.mobility.initialY = 500m
*.macroGnb.cellularNic.phy.eNodeBTxPower = 46dBm

*.microGnb1.mobility.initialX = 500m
*.microGnb1.mobility.initialY = 100m
*.microGnb1.cellularNic.phy.eNodeBTxPower = 30dBm

*.microGnb2.mobility.initialX = 850m
*.microGnb2.mobility.initialY = 700m
*.microGnb2.cellularNic.phy.eNodeBTxPower = 30dBm

*.microGnb3.mobility.initialX = 150m
*.microGnb3.mobility.initialY = 700m
*.microGnb3.cellularNic.phy.eNodeBTxPower = 30dBm

# Background interference cells — simulate neighbouring network
*.bgCell[0].mobility.initialX = 0m
*.bgCell[0].mobility.initialY = 0m
*.bgCell[1].mobility.initialX = 1000m
*.bgCell[1].mobility.initialY = 0m
*.bgCell[2].mobility.initialX = 0m
*.bgCell[2].mobility.initialY = 1000m
*.bgCell[3].mobility.initialX = 1000m
*.bgCell[3].mobility.initialY = 1000m
*.bgCell[*].cellularNic.phy.eNodeBTxPower = 30dBm
*.bgCell[*].cellularNic.numCarriers = 1
*.bgCell[*].cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"

# ---------------------------------------------------------------
# UE mobility
# ---------------------------------------------------------------
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

*.ue[*].mobility.typename = "RandomWaypointMobility"
*.ue[*].mobility.speed = uniform(1mps, 5mps)
*.ue[*].mobility.waitTime = uniform(0s, 5s)
*.ue[*].mobility.initialX = uniform(0m, 1000m)
*.ue[*].mobility.initialY = uniform(0m, 1000m)

# ---------------------------------------------------------------
# Cell association
# ---------------------------------------------------------------
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1
**.dynamicCellAssociation = true
**.enableHandover = true

# X2 app configuration — one app per peer for each gNB
*.macroGnb.numX2Apps = 3
*.microGnb1.numX2Apps = 3
*.microGnb2.numX2Apps = 3
*.microGnb3.numX2Apps = 3

# X2 server ports
*.macroGnb.x2App[*].server.localPort = 5000 + ancestorIndex(1)
*.microGnb1.x2App[*].server.localPort = 5000 + ancestorIndex(1)
*.microGnb2.x2App[*].server.localPort = 5000 + ancestorIndex(1)
*.microGnb3.x2App[*].server.localPort = 5000 + ancestorIndex(1)

# X2 client connections — each gNB connects to its 3 peers
*.macroGnb.x2App[0].client.connectAddress = "microGnb1%x2ppp0"
*.macroGnb.x2App[1].client.connectAddress = "microGnb2%x2ppp0"
*.macroGnb.x2App[2].client.connectAddress = "microGnb3%x2ppp0"

*.microGnb1.x2App[0].client.connectAddress = "macroGnb%x2ppp0"
*.microGnb1.x2App[1].client.connectAddress = "microGnb2%x2ppp1"
*.microGnb1.x2App[2].client.connectAddress = "microGnb3%x2ppp1"

*.microGnb2.x2App[0].client.connectAddress = "macroGnb%x2ppp1"
*.microGnb2.x2App[1].client.connectAddress = "microGnb1%x2ppp1"
*.microGnb2.x2App[2].client.connectAddress = "microGnb3%x2ppp2"

*.microGnb3.x2App[0].client.connectAddress = "macroGnb%x2ppp2"
*.microGnb3.x2App[1].client.connectAddress = "microGnb1%x2ppp2"
*.microGnb3.x2App[2].client.connectAddress = "microGnb2%x2ppp2"


# UE heterogeneity — different device capabilities
# High-end phones (UE 0-24) — higher TX power, better antenna
*.ue[0..24].cellularNic.phy.ueTxPower = 26dBm

# Low-end IoT devices (UE 25-49) — lower TX power
*.ue[25..49].cellularNic.phy.ueTxPower = 20dBm
# ---------------------------------------------------------------
# Traffic: CBR downlink from server to all UEs
# ---------------------------------------------------------------
*.ue[*].numApps = 3
*.ue[*].app[0].typename = "CbrReceiver"
*.ue[*].app[0].localPort = 3000
*.ue[*].app[1].typename = "CbrSender"
*.ue[*].app[1].packetSize = 100B
*.ue[*].app[1].samplingTime = 0.02s
*.ue[*].app[1].destAddress = "server"
*.ue[*].app[1].destPort = 5000
*.ue[*].app[1].localPort = 4000 + ancestorIndex(1)
*.ue[*].app[1].startTime = uniform(0s, 0.02s)

*.ue[0..29].app[2].typename = "UdpBasicApp"
*.ue[0..29].app[2].destAddresses = "server"
*.ue[0..29].app[2].destPort = 6000
*.ue[0..29].app[2].messageLength = 500B
*.ue[0..29].app[2].sendInterval = 5ms
*.ue[0..29].app[2].startTime = 50s
*.ue[0..29].app[2].stopTime = 65s
*.ue[30..49].app[2].typename = "UdpBasicApp"
*.ue[30..49].app[2].destAddresses = "server"
*.ue[30..49].app[2].destPort = 6000
*.ue[30..49].app[2].messageLength = 100B
*.ue[30..49].app[2].sendInterval = 100ms
*.ue[30..49].app[2].startTime = 50s
*.ue[30..49].app[2].stopTime = 70s

*.server.numApps = 52
# Group 1 (UE 0-19): Video streaming — large packets, higher rate
*.server.app[0..19].typename = "CbrSender"
*.server.app[0..19].packetSize = 1400B
*.server.app[0..19].samplingTime = 0.004s
*.server.app[0..19].destAddress = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[0..19].destPort = 3000
*.server.app[0..19].localPort = 3088 + ancestorIndex(0)
*.server.app[0..19].startTime = uniform(0s, 0.02s)

# Group 2 (UE 20-34): Web browsing — medium packets
*.server.app[20..34].typename = "CbrSender"
*.server.app[20..34].packetSize = 500B
*.server.app[20..34].samplingTime = 0.02s
*.server.app[20..34].destAddress = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[20..34].destPort = 3000
*.server.app[20..34].localPort = 3088 + ancestorIndex(0)
*.server.app[20..34].startTime = uniform(0s, 0.02s)

# Group 3 (UE 35-49): IoT — tiny frequent packets
*.server.app[35..49].typename = "CbrSender"
*.server.app[35..49].packetSize = 40B
*.server.app[35..49].samplingTime = 0.01s
*.server.app[35..49].destAddress = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[35..49].destPort = 3000
*.server.app[35..49].localPort = 3088 + ancestorIndex(0)
*.server.app[35..49].startTime = uniform(0s, 0.02s)

*.server.app[50].typename = "CbrReceiver"
*.server.app[50].localPort = 5000
*.server.app[51].typename = "UdpSink"
*.server.app[51].localPort = 6000
# ---------------------------------------------------------------
# VECTOR RECORDING
# ---------------------------------------------------------------
# Module paths below were verified against `opp_scavetool query -f 'type=~vector'`.
# See CHANGES.md for what was removed and why.
**.vector-recording = true

# --- gNB MAC: scheduler resource allocation. This is the congestion signal. --
# avgServedBlocksDl exists ONLY on <gnb>.cellularNic.mac. The previous
# `mac.**.` pattern required an extra path element and never matched.
*.macroGnb.cellularNic.mac.avgServedBlocksDl.result-recording-modes = vector
*.macroGnb.cellularNic.mac.avgServedBlocksUl.result-recording-modes = vector
*.microGnb*.cellularNic.mac.avgServedBlocksDl.result-recording-modes = vector
*.microGnb*.cellularNic.mac.avgServedBlocksUl.result-recording-modes = vector

# --- gNB MAC: queueing delay and HARQ ---------------------------------------
*.macroGnb.cellularNic.mac.macDelayDl.result-recording-modes = vector
*.microGnb*.cellularNic.mac.macDelayDl.result-recording-modes = vector
**.cellularNic.mac.harqErrorRateDl.result-recording-modes = vector
**.cellularNic.mac.harqErrorRateUl.result-recording-modes = vector
**.cellularNic.mac.harqTxAttemptsDl.result-recording-modes = vector
**.cellularNic.nrMac.harqErrorRateDl.result-recording-modes = vector
**.cellularNic.nrMac.harqErrorRateUl.result-recording-modes = vector
**.cellularNic.nrMac.harqTxAttemptsDl.result-recording-modes = vector

# --- Channel quality --------------------------------------------------------
# CQI and servingCell live on phy / nrPhy. UEs carry BOTH an LTE and an NR
# stack; which one is live is not yet known, so record both and compare counts.
*.ue[*].cellularNic.phy.averageCqiDl.result-recording-modes = vector
*.ue[*].cellularNic.phy.averageCqiUl.result-recording-modes = vector
*.ue[*].cellularNic.phy.servingCell.result-recording-modes = vector
*.ue[*].cellularNic.nrPhy.averageCqiDl.result-recording-modes = vector
*.ue[*].cellularNic.nrPhy.averageCqiUl.result-recording-modes = vector
*.ue[*].cellularNic.nrPhy.servingCell.result-recording-modes = vector

# SINR lives on channelModel / nrChannelModel, NOT on phy. The previous
# `phy.rcvdSinrDl` line matched nothing.
*.ue[*].cellularNic.channelModel[*].rcvdSinrDl.result-recording-modes = vector
*.ue[*].cellularNic.nrChannelModel[*].rcvdSinrDl.result-recording-modes = vector
*.macroGnb.cellularNic.channelModel[*].measuredSinrUl.result-recording-modes = vector
*.microGnb*.cellularNic.channelModel[*].measuredSinrUl.result-recording-modes = vector

# --- RLC ---------------------------------------------------------------------
# rlcThroughputDl is a RUNNING AVERAGE (total bytes / elapsed time), not an
# instantaneous rate. Kept for diagnosis only. Do NOT use it as a throughput
# feature; use the PDCP byte counters below instead.
**.cellularNic.rlc.um.rlcThroughputDl.result-recording-modes = vector
**.cellularNic.rlc.um.rlcThroughputUl.result-recording-modes = vector
**.cellularNic.rlc.um.rlcDelayDl.result-recording-modes = vector
**.cellularNic.nrRlc.um.rlcThroughputDl.result-recording-modes = vector
**.cellularNic.nrRlc.um.rlcThroughputUl.result-recording-modes = vector
**.cellularNic.nrRlc.um.rlcDelayDl.result-recording-modes = vector

# --- Byte counters: the correct throughput source ---------------------------
# These emit inet::Packet OBJECTS, so the vector(packetBytes) filter is
# mandatory. Plain `vector` crashes with 'Cannot convert cObject * to double'.
# Each emission carries one packet's size, so summing within a bin gives
# bytes-in-bin. Do NOT difference them: they are not cumulative counters.
*.ue[*].cellularNic.pdcp.sentPacketToUpperLayer.result-recording-modes = vector(packetBytes)
*.ue[*].cellularNic.pdcp.receivedPacketFromUpperLayer.result-recording-modes = vector(packetBytes)
*.macroGnb.cellularNic.pdcp.sentPacketToUpperLayer.result-recording-modes = vector(packetBytes)
*.microGnb*.cellularNic.pdcp.sentPacketToUpperLayer.result-recording-modes = vector(packetBytes)

# --- Application layer -------------------------------------------------------
# cbrFrameDelay does NOT exist in this model; the real statistic is
# endToEndDelay on the receiving app.
*.ue[*].app[0].endToEndDelay.result-recording-modes = vector
*.ue[*].app[0].packetReceived.result-recording-modes = vector(packetBytes)

# --- Backhaul queues (wired side, not the MAC buffer) ------------------------
**.pppIf.queue.queueLength.result-recording-modes = vector

# REMOVED, statistics do not exist in Simu5G 1.4.3:
#   **.cellularNic.mac.**.macBufferSize      (no MAC buffer statistic at all)
#   **.cellularNic.mac.**.droppedPkts        (no such statistic)
#   **.app[0].cbrFrameDelay                  (use endToEndDelay)

# ---------------------------------------------------------------
# Configs
# ---------------------------------------------------------------
[Config UrbanCongestion]
description = "Urban congestion cluster - macro + 3 micro gNBs, 50 UEs"



[Config Medium]
extends = UrbanCongestion
sim-time-limit = 30s
*.numUEs = 10
# Receivers must sit ABOVE the sender indices, else the CbrReceiver and
# UdpSink vanish and all uplink traffic is sent to closed ports.
*.server.numApps = 12
*.server.app[10].typename = "CbrReceiver"
*.server.app[10].localPort = 5000
*.server.app[11].typename = "UdpSink"
*.server.app[11].localPort = 6000


[Config Tiny]
extends = UrbanCongestion
sim-time-limit = 5s
*.numUEs = 2
*.server.numApps = 4
*.server.app[2].typename = "CbrReceiver"
*.server.app[2].localPort = 5000
*.server.app[3].typename = "UdpSink"
*.server.app[3].localPort = 6000

[Config GradualCongestion]
extends = UrbanCongestion
*.ue[0..9].app[2].startTime = 30s
*.ue[0..19].app[2].startTime = 50s
*.ue[0..29].app[2].startTime = 70s
*.ue[0..29].app[2].sendInterval = 10ms
*.ue[0..29].app[2].stopTime = 110s

[Config LightLoad]
extends = UrbanCongestion
description = "20 UEs, light CBR traffic — baseline low-load scenario"
*.numUEs = 20
*.server.numApps = 22
*.server.app[0..19].packetSize = 100B
*.server.app[0..19].samplingTime = 0.02s
*.server.app[20].typename = "CbrReceiver"
*.server.app[20].localPort = 5000
*.server.app[21].typename = "UdpSink"
*.server.app[21].localPort = 6000

[Config HeavyLoad]
extends = UrbanCongestion
description = "50 UEs, heavy DL traffic — saturates scheduler"
*.server.app[0..49].packetSize = 800B
*.server.app[0..49].samplingTime = 0.01s

[Config HighMobility]
extends = UrbanCongestion
description = "50 UEs moving at vehicular speed — frequent CQI drops"
*.ue[*].mobility.speed = uniform(10mps, 30mps)
*.ue[*].mobility.waitTime = uniform(0s, 1s)

[Config LowMobility]
extends = UrbanCongestion
description = "50 UEs moving at pedestrian speed — stable connections"
*.ue[*].mobility.speed = uniform(0.5mps, 1.5mps)
*.ue[*].mobility.waitTime = uniform(5s, 15s)